name: Refresh data and deploy
on:
  workflow_dispatch:
    inputs:
      full_import:
        description: Bootstrap or reconcile all historical ticker data
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '30 2 * * 2-6'
    - cron: '0 4 1 * *'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Refresh latest market prices on weekday runs
        if: github.event.schedule != '0 4 1 * *' && inputs.full_import != true
        run: npm run data:refresh
      - name: Reconcile full archive on the first of each month
        if: github.event.schedule == '0 4 1 * *' || inputs.full_import == true
        run: npm run data:import
      - name: Refresh latest prices after reconciliation
        if: github.event.schedule == '0 4 1 * *' || inputs.full_import == true
        run: npm run data:refresh
      - name: Commit refreshed market data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "chore: refresh market data"
          git push
      - run: npm test && npm run build
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v4
